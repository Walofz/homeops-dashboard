<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign in — HomeOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f2f3f7;background:#090b10;font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:22px}.glow{position:fixed;width:620px;height:620px;border-radius:50%;background:#735cf51a;filter:blur(20px);top:-280px;right:-230px;pointer-events:none}.login{position:relative;width:min(100%,420px);background:#11141c;border:1px solid #292e3b;border-radius:18px;padding:38px;box-shadow:0 28px 80px #0008}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:#917eff;color:#11141c;font:28px Georgia}.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:1.3px;color:#8991a1;margin:25px 0 8px}.login h1{font-size:28px;letter-spacing:-1px;margin:0}.login>p{color:#9299a8;font-size:13px;line-height:1.6;margin:9px 0 28px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;color:#c4c9d2;font-weight:600}.field input{background:#0b0d12;border:1px solid #303643;border-radius:8px;color:#f3f4f7;padding:12px 13px;font:14px 'DM Sans',sans-serif;outline:0}.field input:focus{border-color:#917eff;box-shadow:0 0 0 3px #917eff1a}.submit{width:100%;border:0;background:#917eff;color:#110f18;border-radius:8px;padding:12px;cursor:pointer;font:700 13px 'DM Sans',sans-serif;margin-top:8px}.submit:hover{background:#a393ff}.submit:disabled{opacity:.55;cursor:wait}.error{min-height:20px;color:#ff9b88;font-size:12px;margin-top:14px}.foot{margin-top:25px;padding-top:18px;border-top:1px solid #282d37;color:#737b8b;font:10px 'DM Mono',monospace;text-align:center}.status{position:absolute;right:38px;top:45px;font:10px 'DM Mono',monospace;color:#62d69d}.status:before{content:'';display:inline-block;width:6px;height:6px;background:#53d39a;border-radius:50%;margin-right:6px}
  </style>
</head>
<body><div class="glow"></div><main class="login"><div class="mark">H</div><span class="status">SECURE ACCESS</span><p class="eyebrow">HOMEOPS / INFRASTRUCTURE</p><h1>Welcome back.</h1><p>Sign in to view and manage your home infrastructure.</p><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="submit" type="submit">Sign in to HomeOps →</button><div class="error" id="error" aria-live="polite"></div></form><div class="foot">SESSION PROTECTED · HTTPS REQUIRED</div></main><script src="auth.js"></script></body>
</html>
